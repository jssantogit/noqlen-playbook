name: Playbook Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate playbook structure
        run: python3 scripts/validate_playbook_structure.py

      - name: Check repository contamination
        run: python3 scripts/check_repo_contamination.py
